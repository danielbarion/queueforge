[package]
name = "queueforge-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "QueueForge load-shape benchmark harness (shapes A–F)"
rust-version.workspace = true
publish = false

[[bin]]
name = "queueforge-bench"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
futures-lite = "2.6"
hdrhistogram = "7.5"
lapin = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync", "signal"] }
tokio-executor-trait = "2.1"
tokio-reactor-trait = "1.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
