# QueueForge example configuration
# Copy to queueforge.toml and adjust for your environment.
# Override via CLI: queueforge --config /path/to/queueforge.toml
# Or env: QUEUEFORGE_CONFIG, QUEUEFORGE_DATA_DIR, QUEUEFORGE_LOG,
#         QUEUEFORGE_AMQP_ADDR, QUEUEFORGE_MGMT_ADDR,
#         QUEUEFORGE_TLS_ENABLED, QUEUEFORGE_TLS_CERT, QUEUEFORGE_TLS_KEY
#
# Production TLS checklist: docs/PRODUCTION_TLS.md

[listeners]
# AMQP 0-9-1 (use 5671 when TLS is enabled — conventional AMQPS port)
amqp = "0.0.0.0:5672"
# Management HTTP API + SPA (use 15671 when TLS is enabled)
management = "0.0.0.0:15672"
# Prometheus /metrics + temporary /healthz + /readyz (localhost by default).
# Unauthenticated scrape: keep on loopback unless network policy protects the port.
# Remote probes that cannot reach loopback should use the management listener.
# GET /healthz and GET /readyz there are unauthenticated.
# Override the metrics bind only if you accept exposing /metrics.
# Metrics remain plain HTTP even when [tls] is enabled (bind stays loopback).
metrics = "127.0.0.1:15692"

[data]
dir = "./data"
# Group-commit fsync (production default). Options: never | every_n_ms | every_n_messages | always
fsync_policy = "every_n_ms"
fsync_interval_ms = 100
# wal_segment_max_bytes = 134217728
# Refuse durable publishes when free space falls below this many bytes (default 2 GiB).
# disk_free_limit_bytes = 2147483648

[memory]
# Fractions of detected system RAM. Soft raises alarm metrics; hard blocks publishes.
high_watermark_relative = 0.6
soft_watermark_relative = 0.5

[limits]
# frame_max = 131072
# channel_max = 2047
# heartbeat_default = 60
# max_message_bytes = 16777216
# max_connections = 10000
# queue_enqueue_bound = 1024
# basic.qos prefetch_count 0 is unlimited.
# default_prefetch only sizes the internal queue-to-connection delivery buffer.

[management]
# Login rate limits trust X-Forwarded-For only from these proxies.
# trusted_proxy_cidrs = ["10.0.0.0/8"]

[logging]
# RUST_LOG-style filter
level = "info"

# Optional static cluster. Leave members empty for a single node.
# Every node lists the same members, including itself, and keeps its own data
# directory. Classic queues live on one home node (a stable hash of the vhost
# and name); peers forward operations there. A durable quorum queue
# (x-queue-type = quorum) confirms after a majority hold the body in memory.
# Rust and Bun processes can share this list. Cluster protocol version is 1.
# [cluster]
# node_id = "a"
# listen = "127.0.0.1:25672"
# members = [
#   { id = "a", addr = "127.0.0.1:25672" },
#   { id = "b", addr = "127.0.0.1:25673" },
# ]

# Optional TLS for AMQP (AMQPS) and management (HTTPS).
# Disabled by default so local dev stays plain TCP/HTTP.
# When enabled, cert_path and key_path are required (PEM).
# See docs/PRODUCTION_TLS.md.
[tls]
enabled = false
# cert_path = "/etc/queueforge/tls/server.crt"
# key_path = "/etc/queueforge/tls/server.key"
