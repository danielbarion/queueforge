[workspace]
resolver = "2"
members = [
    "crates/queueforge-amqp",
    "crates/queueforge-auth",
    "crates/queueforge-bench",
    "crates/queueforge-compare",
    "crates/queueforge-broker",
    "crates/queueforge-core",
    "crates/queueforge-metrics",
    "crates/queueforge-mgmt",
    "crates/queueforge-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/queueforge/queueforge"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = "0.8"
base64 = "0.22"
bytes = "1.9"
clap = { version = "4.5", features = ["derive", "env"] }
compact_str = { version = "0.9", features = ["serde"] }
cookie = "0.18"
libc = "0.2"
crc32fast = "1.4"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"
mime_guess = "2.0"
rand_core = { version = "0.6", features = ["getrandom"] }
redb = "=2.6.3"
regex = "1.11"
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Pin ring crypto provider so process-level CryptoProvider is unambiguous
# (lapin/dev-deps may also enable ring; avoid dual aws-lc-rs + ring auto-detect failures).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
queueforge-amqp = { path = "crates/queueforge-amqp" }
queueforge-auth = { path = "crates/queueforge-auth" }
queueforge-core = { path = "crates/queueforge-core" }
queueforge-metrics = { path = "crates/queueforge-metrics" }
queueforge-mgmt = { path = "crates/queueforge-mgmt" }
queueforge-store = { path = "crates/queueforge-store" }
