# Baked into the bench image. Same disk flush as rust/configs/queueforge.docker.toml.
# A container limited to one CPU stays one process. More CPUs start one child
# per core. The parent accepts a connection and hands the socket to the child
# that owns that queue. The child does not forward during the measure.

[listeners]
amqp = "0.0.0.0:5672"
management = "0.0.0.0:15672"
metrics = "0.0.0.0:15692"

[data]
dir = "/var/lib/queueforge"
fsync_policy = "every_n_ms"
fsync_interval_ms = 10

[logging]
level = "warn"

[tls]
enabled = false
