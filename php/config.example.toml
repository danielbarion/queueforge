# QueueForge PHP broker. Same client-visible AMQP path as Rust and Bun:
# quorum queues, cluster protocol v1, and the management API. One thread.
# Run from this directory:
#   php bin/queueforge --config config.example.toml --dev-bootstrap

[listeners]
amqp = "127.0.0.1:5675"

[data]
dir = "./data"
fsync_policy = "every_n_ms"
fsync_interval_ms = 10
