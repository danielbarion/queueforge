name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Bun broker dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: cargo test
        working-directory: rust
        # Integration tests share a RabbitMQ fixture and use fixed broker ports.
        run: cargo test --workspace -- --test-threads=1

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: rust
        run: cargo audit

  ui:
    name: UI build + dist check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rust/ui/package-lock.json

      - name: npm ci && build
        working-directory: rust/ui
        run: |
          npm ci
          npm run build

      - name: committed ui/dist must match build
        run: git diff --exit-code rust/ui/dist

  pika-smoke:
    name: pika AMQP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pika
        run: pip install pika

      - name: Build broker
        working-directory: rust
        run: cargo build -p queueforge-broker

      - name: Start broker
        working-directory: rust
        run: |
          DATA_DIR="$(mktemp -d)"
          echo "DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"
          export QUEUEFORGE_DATA_DIR="$DATA_DIR"
          export QUEUEFORGE_AMQP_ADDR="127.0.0.1:5672"
          export QUEUEFORGE_MGMT_ADDR="127.0.0.1:15672"
          ./target/debug/queueforge \
            --config configs/queueforge.example.toml \
            --dev-bootstrap &
          echo "BROKER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for readyz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:15672/readyz; then
              exit 0
            fi
            sleep 0.5
          done
          echo "timeout waiting for readyz" >&2
          exit 1

      - name: Run pika smoke
        env:
          QUEUEFORGE_ADMIN_USER: admin
          QUEUEFORGE_ADMIN_PASSWORD: devpassword12
        working-directory: rust
        run: python3 scripts/pika_smoke.py

      - name: Stop broker
        if: always()
        run: |
          if [[ -n "${BROKER_PID:-}" ]]; then
            kill -TERM "$BROKER_PID" 2>/dev/null || true
            wait "$BROKER_PID" 2>/dev/null || true
          fi

  bun:
    name: Bun broker and console tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build Rust peer for mixed-stack tests
        working-directory: rust
        run: cargo build -p queueforge-broker
      - name: Bun broker tests
        working-directory: bun
        run: |
          bun install --frozen-lockfile
          bun test
      - name: Console tests
        working-directory: console
        run: |
          bun install --frozen-lockfile
          bun test
      - name: Conformance runner regression tests
        working-directory: conformance
        run: |
          bun install --frozen-lockfile
          bun test run.test.ts

  php:
    name: PHP broker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: PHP broker tests
        working-directory: php
        run: php test/run.php

  conformance:
    name: RabbitMQ and cross-stack conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: Build Rust broker
        working-directory: rust
        run: cargo build -p queueforge-broker
      - name: Install Bun broker dependencies
        working-directory: bun
        run: bun install --frozen-lockfile
      - name: Run conformance against RabbitMQ, Rust, Bun and PHP
        working-directory: conformance
        run: |
          bun install --frozen-lockfile
          bun run run.ts
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance/results/
